name: Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r inference/requirements.txt
        pip install -r tests/requirements.txt
    
    - name: Run CPU tests
      run: |
        pytest tests/ -m "not gpu and not distributed" -v --timeout=300
    
    - name: Run basic integration tests
      run: |
        pytest tests/integration/test_model_loading.py -v --timeout=300
        pytest tests/integration/test_inference.py -v --timeout=300

  test-gpu:
    runs-on: ubuntu-latest
    container:
      image: pytorch/pytorch:2.4.1-cuda12.4-cudnn9-devel
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y git
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r inference/requirements.txt
        pip install -r tests/requirements.txt
    
    - name: Run GPU tests
      run: |
        pytest tests/ -m "gpu" -v --timeout=600
      env:
        CUDA_VISIBLE_DEVICES: 0
    
    - name: Run quantization tests
      run: |
        pytest tests/integration/test_quantization.py -v --timeout=600
      env:
        CUDA_VISIBLE_DEVICES: 0
    
    - name: Run kernel tests
      run: |
        pytest tests/integration/test_kernels.py -v --timeout=600
      env:
        CUDA_VISIBLE_DEVICES: 0

  test-integration:
    runs-on: ubuntu-latest
    container:
      image: pytorch/pytorch:2.4.1-cuda12.4-cudnn9-devel
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y git
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r inference/requirements.txt
        pip install -r tests/requirements.txt
    
    - name: Run comprehensive integration tests
      run: |
        pytest tests/integration/test_sample_functionality.py -v --timeout=900
      env:
        CUDA_VISIBLE_DEVICES: 0
    
    - name: Run performance tests
      run: |
        pytest tests/ -m "slow" -v --timeout=1200
      env:
        CUDA_VISIBLE_DEVICES: 0

  test-distributed:
    runs-on: ubuntu-latest
    container:
      image: pytorch/pytorch:2.4.1-cuda12.4-cudnn9-devel
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y git
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r inference/requirements.txt
        pip install -r tests/requirements.txt
    
    - name: Run distributed tests (single GPU simulation)
      run: |
        pytest tests/integration/test_distributed.py -v --timeout=600
      env:
        CUDA_VISIBLE_DEVICES: 0

  lint-and-format:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Run flake8
      run: |
        flake8 tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check code formatting with black
      run: |
        black --check tests/
    
    - name: Check import sorting with isort
      run: |
        isort --check-only tests/
