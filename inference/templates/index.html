<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek RAG Chat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .chat-container {
            height: 500px;
            overflow-y: auto;
            padding: 15px;
            background-color: #fff;
            border-radius: 10px 10px 0 0;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 5px;
            max-width: 80%;
        }
        
        .user-message {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
            margin-left: auto;
        }
        
        .assistant-message {
            background-color: #e9ecef;
            color: #333;
        }
        
        .message-input {
            display: flex;
            padding: 10px;
            background-color: #fff;
            border-top: 1px solid #ddd;
            border-radius: 0 0 10px 10px;
        }
        
        .message-input input {
            flex-grow: 1;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            margin-right: 10px;
        }
        
        .message-input button {
            padding: 10px 15px;
        }
        
        .model-settings {
            margin-bottom: 20px;
        }
        
        .pdf-upload {
            margin-bottom: 20px;
        }
        
        .context-indicator {
            font-size: 0.8em;
            color: #6c757d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>DeepSeek RAG Chat</h1>
            <p>Upload a PDF and chat with DeepSeek about its contents</p>
        </div>
        
        <div class="row">
            <div class="col-md-4">
                <div class="card model-settings">
                    <div class="card-header">
                        <h5>Model Settings</h5>
                    </div>
                    <div class="card-body">
                        <form id="modelForm">
                            <div class="form-group">
                                <label for="ckptPath">Checkpoint Path:</label>
                                <input type="text" class="form-control" id="ckptPath" name="ckptPath" 
                                       placeholder="Path to model checkpoint">
                            </div>
                            <div class="form-group">
                                <label for="configPath">Config Path:</label>
                                <input type="text" class="form-control" id="configPath" name="configPath"
                                       placeholder="Path to model config">
                            </div>
                            <button type="submit" class="btn btn-primary">Load Model</button>
                        </form>
                    </div>
                </div>
                
                <div class="card pdf-upload">
                    <div class="card-header">
                        <h5>Upload PDF</h5>
                    </div>
                    <div class="card-body">
                        <form action="/upload" method="post" enctype="multipart/form-data">
                            <div class="form-group">
                                <input type="file" class="form-control-file" id="pdfFile" name="file" accept=".pdf">
                            </div>
                            <button type="submit" class="btn btn-primary">Upload</button>
                        </form>
                        {% with messages = get_flashed_messages() %}
                            {% if messages %}
                                <div class="alert alert-info mt-3">
                                    <ul class="mb-0">
                                        {% for message in messages %}
                                            <li>{{ message }}</li>
                                        {% endfor %}
                                    </ul>
                                </div>
                            {% endif %}
                        {% endwith %}
                    </div>
                </div>
            </div>
            
            <div class="col-md-8">
                <div class="card">
                    <div class="chat-container" id="chatContainer">
                        <!-- Chat messages will be displayed here -->
                    </div>
                    <div class="message-input">
                        <input type="text" id="messageInput" placeholder="Ask about the PDF...">
                        <button class="btn btn-primary" id="sendBtn">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            let chatHistory = [];
            
            // Handle model loading
            $('#modelForm').submit(function(e) {
                e.preventDefault();
                const ckptPath = $('#ckptPath').val();
                const configPath = $('#configPath').val();
                
                $.ajax({
                    url: '/model/load',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        ckpt_path: ckptPath,
                        config_path: configPath
                    }),
                    success: function(data) {
                        if (data.success) {
                            alert('Model loaded successfully');
                        } else {
                            alert('Error loading model: ' + data.error);
                        }
                    }
                });
            });
            
            // Handle sending messages
            $('#sendBtn').click(sendMessage);
            $('#messageInput').keypress(function(e) {
                if (e.which === 13) {
                    sendMessage();
                }
            });
            
            function sendMessage() {
                const message = $('#messageInput').val().trim();
                if (!message) return;
                
                // Add user message to chat
                addMessage(message, 'user');
                $('#messageInput').val('');
                
                // Add user message to history
                chatHistory.push({
                    role: 'user',
                    content: message
                });
                
                // Send message to server
                $.ajax({
                    url: '/chat',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        message: message,
                        history: chatHistory
                    }),
                    success: function(data) {
                        // Add assistant message to chat
                        addMessage(data.response, 'assistant', data.context_used);
                        
                        // Add assistant message to history
                        chatHistory.push({
                            role: 'assistant',
                            content: data.response
                        });
                        
                        // Scroll chat to bottom
                        scrollToBottom();
                    }
                });
            }
            
            function addMessage(content, role, contextUsed = false) {
                const messageClass = role === 'user' ? 'user-message' : 'assistant-message';
                let messageHtml = `<div class="message ${messageClass}">${content}`;
                
                if (role === 'assistant' && contextUsed) {
                    messageHtml += '<div class="context-indicator">Response based on PDF context</div>';
                }
                
                messageHtml += '</div>';
                $('#chatContainer').append(messageHtml);
                scrollToBottom();
            }
            
            function scrollToBottom() {
                const chatContainer = document.getElementById('chatContainer');
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        });
    </script>
</body>
</html>
